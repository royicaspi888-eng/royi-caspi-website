name: Optimize portfolio images (preview branch only)

on:
  push:
    branches: [portfolio-improvements]
    paths:
      - '.github/workflows/optimize-portfolio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    if: github.ref == 'refs/heads/portfolio-improvements'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: portfolio-improvements
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install 'Pillow>=11,<13'
      - name: Convert and connect gallery assets
        run: python scripts/optimize_portfolio.py
      - name: Commit optimized versions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/optimized
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m 'Use lightweight previews and high-quality zoom pictures'
            git push origin HEAD:portfolio-improvements
          fi
