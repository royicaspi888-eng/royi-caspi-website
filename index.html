
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Royi Caspi | Tattoos & Art</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f4f0e8;
      color: #171717;
      font-family: Georgia, serif;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 6%;
      border-bottom: 2px solid #171717;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    nav a {
      color: inherit;
      text-decoration: none;
      margin-left: 20px;
      font: 12px Arial, sans-serif;
    }

    main {
      min-height: 75vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
    }

    .eyebrow {
      font: 13px Arial, sans-serif;
      letter-spacing: 4px;
    }

    h1 {
      font-size: clamp(55px, 12vw, 150px);
      line-height: 0.9;
      margin: 30px 0;
    }

    .subtitle {
      font-size: 22px;
      font-style: italic;
    }

    .button {
      margin-top: 35px;
      padding: 16px 30px;
      border: 2px solid #171717;
      color: #171717;
      text-decoration: none;
      font: bold 13px Arial, sans-serif;
      letter-spacing: 2px;
    }

    .button:hover {
      background: #171717;
      color: #f4f0e8;
    }

    footer {
      text-align: center;
      padding: 25px;
      border-top: 2px solid #171717;
      font: 12px Arial, sans-serif;
    }

    @media (max-width: 600px) {
      header { flex-direction: column; gap: 20px; }
      nav a { margin: 0 8px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">R.C.</div>
    <nav>
      <a href="#home">HOME</a>
      <a href="#portfolio">PORTFOLIO</a>
      <a href="#flash">FLASH</a>
      <a href="#contact">CONTACT</a>
    </nav>
  </header>

  <main id="home">
    <p class="eyebrow">INDEPENDENT TATTOO ARTIST</p>
    <h1>ROYI<br>CASPI</h1>
    <p class="subtitle">Tattoos & Original Artwork</p>
    <a class="button"
       href="https://www.instagram.com/by_r.n.c/"
       target="_blank"
       rel="noopener noreferrer">
      EXPLORE MY WORK ↗
    </a>
  </main>

  <footer>
    © 2026 ROYI CASPI — TATTOOS & ART
  </footer>
</body>
</html>
